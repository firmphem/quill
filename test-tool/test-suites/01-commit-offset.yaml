tests:
  - name: checking offset commits within single partition
    steps:
      - name: truncate db
        type: golang
        func: truncateDatabase

      - name: recreate kafka topic
        type: golang
        func: recreateKafkaTopic

      # 3 payload, 1 metric, partiiton 6
      - name: produce payload
        type: golang
        func: producePayload
        positional_args: [3, 5, 6, false, false ]

      - name: run consumer to consume 1 of 3 message
        type: shell
        func: ../quill --exit-after-n-messages 1 %CONFIG_FILE%
        ignore_errors: true
        print_output: false

      - name: get current offset after consuming 1 from 3 messages
        type: golang
        func: getKafkaGroupConsumerCurrentOffset
        positional_args: [6]
        ignore_errors: false
        print_output: true
        assert:
           condition: "="
           expected: 1

      - name: run consumer to consume 2 of 3 message
        type: shell
        func: ../quill --exit-after-n-messages 1 %CONFIG_FILE%
        ignore_errors: true
        print_output: false

      - name: get current offset after consuming 2 from 3 messages
        type: golang
        func: getKafkaGroupConsumerCurrentOffset
        positional_args: [6]
        ignore_errors: false
        print_output: true
        assert:
           condition: "="
           expected: 2

      - name: run consumer to consume 3 message
        type: shell
        func: ../quill --exit-after-n-messages 1 %CONFIG_FILE%
        ignore_errors: true
        print_output: false

      - name: get current offset after consuming 3 from 3 messages
        type: golang
        func: getKafkaGroupConsumerCurrentOffset
        positional_args: [6]
        ignore_errors: false
        print_output: true
        assert:
           condition: "="
           expected: 3
